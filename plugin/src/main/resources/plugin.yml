name: DIVbridge
version: '${version}'
main: divbridge.DIVbridge
api-version: '1.21'
description: Chat bridge, join messages, remote commands and proximity voice between Minecraft and Discord.
commands:
  divbridge:
    description: Admin command for DIVbridge
    usage: /divbridge reload
    permission: divbridge.admin
  link:
    description: Get a code to link your Minecraft account to Discord
    usage: /link
    permission: divbridge.link
  unlink:
    description: Unlink your Minecraft account from Discord
    usage: /unlink
    permission: divbridge.link
permissions:
  divbridge.admin:
    description: Reload the DIVbridge config
    default: op
  divbridge.link:
    description: Link your account for proximity voice
    default: true
