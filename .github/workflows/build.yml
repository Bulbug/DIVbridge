name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the jar to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build plugin
        working-directory: plugin
        run: gradle build --no-daemon

      - name: Keep the jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIVbridge
          path: plugin/build/libs/*.jar

      # Pushing a tag like v1.0.0 publishes a GitHub Release with the jar attached
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/build/libs/*.jar
          generate_release_notes: true
